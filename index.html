
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOTDER Signals</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>BOTDER <span style="color:#20c997">SIGNALS</span></h1>
      <div class="subtitle">ANALIZADOR DE MERCADO · DERIV MT5</div>
      <p id="connection">● Desconectado</p>
    </header>

    <section class="panel">
      <h3>Mercados disponibles</h3>
      <div id="markets" class="grid"></div>
    </section>

    <section class="panel">
      <h3 id="chart-title">Selecciona un mercado</h3>
      <div id="chart-area" style="width:100%;height:350px"></div>
      <div class="muted" id="current-price">Esperando cotizaciones...</div>
    </section>

    <section class="panel">
      <h3>Señales activas</h3>
      <div id="signals">
        <p class="muted">Esperando oportunidades...</p>
      </div>
    </section>

    <section class="panel">
      <h3>Mis operaciones</h3>
      <div id="operations">
        <p class="muted">Todavía no has marcado ninguna entrada.</p>
      </div>
    </section>

    <section class="panel">
      <h3>Historial</h3>
      <div id="history">
        <p class="muted">Sin operaciones registradas.</p>
      </div>
    </section>
  </div>

  <script src="charts.js"></script>
  <script src="app.js"></script>
  <script src="deriv.js"></script>
  <script>
    const marketList = document.getElementById("markets");

    const instruments = [
      "Volatility 10 (1s)",
      "Volatility 25 (1s)",
      "Volatility 50 (1s)",
      "Volatility 75 (1s)",
      "Volatility 10",
      "Volatility 25",
      "Volatility 50",
      "Volatility 75"
    ];

    instruments.forEach(name => {
      const button = document.createElement("button");
      button.className = "market";
      button.dataset.market = name;
      button.innerHTML = `<strong>${name}</strong><span class="muted">Seleccionar gráfico</span>`;
      button.addEventListener("click", () => selectMarket(name));
      marketList.appendChild(button);
    });

    document.addEventListener("derivSymbols", event => {
      document.getElementById("connection").textContent =
        "● Conectado · Instrumentos recibidos";
    });

    document.addEventListener("derivTick", event => {
      const tick = event.detail;
      if (!tick) return;
      document.getElementById("current-price").textContent =
        "Precio en vivo: " + tick.quote;
    });

    document.addEventListener("derivHistory", event => {
      if (event.detail.candles.length) {
        updateCandles(event.detail.candles);
      }
    });

    connectDeriv();
  </script>
</body>
</html>
